name: upstream monitor

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: compare audited revision
        id: compare
        shell: bash
        run: |
          set +e
          output=$(./Scripts/check-upstream.sh 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          {
            echo 'report<<EOF'
            echo "$output"
            echo 'EOF'
            echo "changed=$([[ $status -eq 0 ]] && echo false || echo true)"
          } >> "$GITHUB_OUTPUT"

      - name: open or update audit issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.compare.outputs.report }}
        shell: bash
        run: |
          title='audit new codexbar upstream commits'
          body=$(printf 'The native parity baseline is stale.\n\n```text\n%s\n```\n\nRun `./Scripts/check-upstream.sh`, port applicable behavior, verify, and update `UPSTREAM_REVISION`.' "$REPORT")
          number=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
