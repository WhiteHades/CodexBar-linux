name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            file-pattern: x86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            file-pattern: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 ninja-build pkg-config python3-venv \
            libglib2.0-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev libncurses-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install --disable-pip-version-check meson==1.6.1
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"

      - name: validate release version
        if: github.event_name == 'release'
        shell: bash
        run: |
          version=$(sed -n "s/^[[:space:]]*version:[[:space:]]*'\([^']*\)'.*/\1/p" meson.build)
          test "${{ github.event.release.tag_name }}" = "v$version"

      - name: build and package
        env:
          CC: gcc-14
        run: ./Scripts/package.sh

      - name: verify artifact
        shell: bash
        run: |
          checksum=$(find dist -maxdepth 1 -name '*.sha256' -type f -print -quit)
          archive=${checksum%.sha256}
          test -n "$checksum"
          (cd dist && sha256sum -c "$(basename "$checksum")")
          tar -tzf "$archive" | grep -Fx './usr/local/bin/codexbar-linux'
          tar -tzf "$archive" | grep -Fx './usr/local/bin/codexbar-process-supervisor'
          tar -tzf "$archive" | grep -Fx './usr/local/share/applications/com.steipete.codexbar.desktop'
          tar -tzf "$archive" | grep -Fx './etc/xdg/autostart/codexbar-status.desktop'
          tar --numeric-owner -tvzf "$archive" |
            awk '$2 != "0/0" || ($1 ~ /^d/ && $1 != "drwxr-xr-x") { exit 1 }'
          file .build/release/linux/codexbar-linux | grep -F '${{ matrix.file-pattern }}'
          .build/release/linux/codexbar-linux --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: codexbar-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/* --clobber
