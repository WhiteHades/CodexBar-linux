name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-x86_64
            runner: ubuntu-24.04
            cc: gcc-14
            compiler: gcc-14
            sanitize: none
          - name: clang-x86_64
            runner: ubuntu-24.04
            cc: clang-18
            compiler: clang-18
            sanitize: none
          - name: gcc-aarch64
            runner: ubuntu-24.04-arm
            cc: gcc-14
            compiler: gcc-14
            sanitize: none
          - name: clang-aarch64
            runner: ubuntu-24.04-arm
            cc: clang-18
            compiler: clang-18
            sanitize: none
          - name: clang-asan-ubsan
            runner: ubuntu-24.04
            cc: clang-18
            compiler: clang-18
            sanitize: address,undefined
    env:
      CC: ${{ matrix.cc }}
      BUILD_DIR: .build/ci-${{ matrix.name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: install dependencies
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          sudo apt-get update
          sudo apt-get install -y "$COMPILER" ninja-build pkg-config python3-venv \
            libglib2.0-dev libcurl4-openssl-dev libjson-c-dev libsqlite3-dev libncurses-dev
          python3 -m venv "$RUNNER_TEMP/meson"
          "$RUNNER_TEMP/meson/bin/pip" install --disable-pip-version-check meson==1.6.1
          echo "$RUNNER_TEMP/meson/bin" >> "$GITHUB_PATH"

      - name: configure
        shell: bash
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          args=(setup "$BUILD_DIR" --buildtype=debug --wrap-mode=nodownload)
          if [[ "$SANITIZE" != none ]]; then
            args+=("-Db_sanitize=$SANITIZE" -Db_lundef=false)
          fi
          meson "${args[@]}"

      - name: compile and test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson compile -C "$BUILD_DIR"
          meson test -C "$BUILD_DIR" --no-rebuild --print-errorlogs

      - name: verify repository and version
        run: |
          ./Scripts/verify-tree.sh
          version=$(meson introspect --projectinfo "$BUILD_DIR" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$("$BUILD_DIR/linux/codexbar-linux" --version)" = "CodexBar $version"
